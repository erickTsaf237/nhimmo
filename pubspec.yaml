name: myimmo
description: "Gestion locative locale : appartements, locataires, relevés, factures."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  archive: ^3.6.1
  cryptography: ^2.9.0
  drift: ">=2.26.0 <2.34.0"
  excel: ^4.0.6
  file_picker: ^13.1.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  image_picker: ^1.2.3
  intl: any
  mobile_scanner: ^7.4.2
  path: ^1.9.1
  path_provider: ^2.1.6
  pdf: ^3.12.0
  printing: ^5.14.3
  qr_flutter: ^4.1.0
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ">=2.26.0 <2.34.0"
  build_runner: ^2.15.1
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/fonts/

# Icône de l'application (générée depuis logo.png) : dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon_full.png"
  adaptive_icon_background: "#081A3D"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  remove_alpha_ios: true
